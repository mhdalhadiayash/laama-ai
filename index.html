<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laama - Your Local AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #000;
            min-height: 100vh;
            color: #fff;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .logo {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: #fff;
            padding: 5px;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #fff;
        }

        .header .status {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #fff;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Chat Area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            margin-top: 20px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 20px;
            min-height: 400px;
            max-height: 60vh;
        }

        .message {
            display: flex;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .message.ai .message-avatar {
            background: #333;
        }

        .message.user .message-avatar {
            background: #fff;
            color: #000;
        }

        .message-content {
            max-width: 70%;
            padding: 14px 18px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 15px;
        }

        .message.ai .message-content {
            background: rgba(255,255,255,0.1);
            border-bottom-left-radius: 4px;
        }

        .message.user .message-content {
            background: #fff;
            color: #000;
            border-bottom-right-radius: 4px;
        }

        .message.loading .message-content {
            display: flex;
            gap: 4px;
            padding: 20px 24px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: rgba(255,255,255,0.6);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* Input Area */
        .input-container {
            padding: 20px 0;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 8px;
            transition: border-color 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: #fff;
        }

        .input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 15px;
            padding: 12px;
        }

        .input-wrapper input::placeholder {
            color: rgba(255,255,255,0.4);
        }

        .send-btn {
            background: #fff;
            border: none;
            border-radius: 12px;
            padding: 12px 24px;
            color: #000;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Welcome Message */
        .welcome {
            text-align: center;
            padding: 40px 20px;
        }

        .welcome-logo {
            width: 80px;
            height: 80px;
            border-radius: 20px;
            background: #fff;
            padding: 10px;
            margin: 0 auto 20px;
        }

        .welcome h2 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #fff;
        }

        .welcome p {
            color: rgba(255,255,255,0.6);
            font-size: 16px;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 15px;
            color: rgba(255,255,255,0.4);
            font-size: 12px;
        }

        /* Code blocks */
        .message-content pre {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            margin: 10px 0;
            overflow-x: auto;
        }
        .message-content code {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
        }
        .message-content p {
            margin: 8px 0;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .message-content {
                max-width: 85%;
            }
            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <img src="logo.jpeg" alt="Laama" class="logo">
            <h1>Laama</h1>
            <div class="status">
                <span class="status-dot"></span>
                <span>Online</span>
            </div>
        </header>

        <div class="chat-container">
            <div class="chat-messages" id="chat">
                <div class="welcome">
                    <img src="logo.jpeg" alt="Laama" class="welcome-logo">
                    <h2>Welcome to Laama</h2>
                    <p>Your local AI assistant. Ask me anything!</p>
                </div>
            </div>

            <div class="input-container">
                <div class="input-wrapper">
                    <input type="text" id="input" placeholder="Type your message..." autocomplete="off">
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">Send</button>
                </div>
            </div>
        </div>

        <footer class="footer">
            Powered by Local AI | Running on your hardware
        </footer>
    </div>

    <script>
        // Use Cloudflare URL for public access
        const API_URL = 'https://wto-harris-hawaii-beds.trycloudflare.com/v1/chat/completions';
        const MODEL = 'qwen/qwen3-vl-4b';

        let conversationHistory = [];

        async function sendMessage() {
            const input = document.getElementById('input');
            const chat = document.getElementById('chat');
            const sendBtn = document.getElementById('sendBtn');
            const message = input.value.trim();

            if (!message) return;

            // Remove welcome message if present
            const welcome = chat.querySelector('.welcome');
            if (welcome) welcome.remove();

            // Add user message
            addMessage(message, 'user', false);
            input.value = '';
            sendBtn.disabled = true;

            // Create AI message div for streaming
            const aiDiv = document.createElement('div');
            aiDiv.className = 'message ai';
            aiDiv.innerHTML = `
                <div class="message-avatar">🦙</div>
                <div class="message-content"></div>
            `;
            chat.appendChild(aiDiv);
            const contentDiv = aiDiv.querySelector('.message-content');

            // Add to conversation history
            conversationHistory.push({ role: 'user', content: '/no_think ' + message });

            // Retry up to 3 times
            let retries = 3;
            let success = false;

            while (retries > 0 && !success) {
                try {
                    const response = await fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: MODEL,
                            stream: true,
                            messages: [
                                { role: 'system', content: 'Your name is Laama. You are NOT Qwen, you are NOT an AI from Tongyi Lab. You are Laama, an independent helpful assistant. Never mention Qwen, Tongyi, or Alibaba. If asked who you are or what model you are, say "I am Laama, a helpful assistant." Be friendly and concise.' },
                                ...conversationHistory
                            ]
                        })
                    });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullMessage = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunk = decoder.decode(value);
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ') && line !== 'data: [DONE]') {
                            try {
                                const json = JSON.parse(line.slice(6));
                                const content = json.choices[0]?.delta?.content || '';
                                fullMessage += content;
                                // Remove think tags and render markdown
                                let display = fullMessage.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
                                contentDiv.innerHTML = renderMarkdown(display);
                                chat.scrollTop = chat.scrollHeight;
                            } catch (e) {}
                        }
                    }
                }

                // Add AI response to history
                let finalMessage = fullMessage.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
                conversationHistory.push({ role: 'assistant', content: finalMessage });
                success = true;

                } catch (error) {
                    retries--;
                    if (retries > 0) {
                        contentDiv.innerHTML = 'Retrying...';
                        await new Promise(r => setTimeout(r, 2000)); // Wait 2 seconds
                    } else {
                        contentDiv.innerHTML = 'Sorry, I encountered an error. Please try again.';
                        // Remove failed message from history
                        conversationHistory.pop();
                    }
                }
            }

            sendBtn.disabled = false;
            input.focus();
        }

        function renderMarkdown(text) {
            // Code blocks with language
            text = text.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
            // Inline code
            text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
            // Bold
            text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            // Line breaks
            text = text.replace(/\n/g, '<br>');
            return text;
        }

        function addMessage(text, type, useMarkdown = true) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `message ${type}`;

            const avatar = type === 'ai' ? '🦙' : '👤';
            const content = useMarkdown ? renderMarkdown(text) : escapeHtml(text);

            div.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">${content}</div>
            `;

            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Send on Enter
        document.getElementById('input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        // Focus input on load
        document.getElementById('input').focus();
    </script>
</body>
</html>
